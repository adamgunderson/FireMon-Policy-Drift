; FireMon policy drift report - reference configuration.
;
; Copy to config.ini and edit for your environment.
; If this file holds any secret, restrict it:   chmod 600 config.ini
;
; Every secret can instead be supplied through the environment, which is the
; recommended approach so the file itself carries nothing sensitive:
;   FMDRIFT_PASSWORD       service account password -> [firemon] password
;   FMDRIFT_SMTP_PASSWORD  SMTP password            -> [smtp] password
; The environment always wins over the file.

[firemon]
; Base URL of the FireMon server, no trailing slash. When running directly on
; the appliance, https://localhost avoids DNS and any firewall in the path.
base_url    = https://firemon.example.com
domain_id   = 1

; token = exchange the username/password below for a session token once per
;         run (recommended).   basic = send HTTP basic auth on every call.
auth_mode   = token
username    = svc-firemon-drift
password    =

; Leave verify_tls true in production. Appliances often use a self-signed
; certificate, so on-box use needs either false or a ca_bundle path.
verify_tls  = true
ca_bundle   =

timeout     = 60
max_retries = 3
page_size   = 200

[pair]
; ONE pair: the two firewalls to compare, by name as FireMon shows them (or
; by id). Run --list-devices FTDV to see names. The primary is the reference;
; the secondary is the one expected to mirror it. Leave both blank when using
; [pair:NAME] sections instead (below).
primary   =
secondary =

; Optional friendlier labels for the report, e.g. "Production (US East)".
primary_label   =
secondary_label =

; SEVERAL pairs: one [pair:NAME] section each. The name is what the subject
; line, the log and --pair use. Every key below is optional except primary
; and secondary; anything left out comes from the global [policies],
; [filter], [property_filters], [compare] and [email] sections, so pairs
; that behave alike need only the two device names. "all" or "none" turns a
; global value OFF for that pair. Each pair keeps its own last-run state and
; sends its own email.
;
;[pair:us-dr]
;primary         = USE-FW-FTDV-01
;secondary       = USW-FW-FTDV-01
;primary_label   = US East (production)
;secondary_label = US West (DR)
;policies        = AZURE USE Transit = AZURE USW Transit, KF-CLOUD-PREFILTER
;categories      = ESO*, SECURITY
;change_requests = none
;applications    = none
;rule_names      =
;recipients      = netops-us@example.com, dr-team@example.com
;send_when       = changes
;subject_prefix  = [US DR]
;fields          = default
;object_mode     = name
;match_by        = name
;
;[pair:apac-dr]
;primary   = APE1-FW-FTDV-01
;secondary = APSE2-FW-FTDV-01
;recipients = netops-apac@example.com
;
; A pair whose policy or property names do not fit on one line can use a
; section instead, in the same form as the global one:
;[policies:apac-dr]
;APAC East Transit = APAC South-East Transit
;[property_filters:apac-dr]
;Business Owner = netops-apac@example.com
;[normalise:apac-dr]
;east = (?i)APE1 => SITE
;west = (?i)APSE2 => SITE

[policies]
; Which policy on the primary is compared with which on the secondary:
;   primary policy name = secondary policy name
; Names are the display names from --list-policies. Rules are then matched
; by name WITHIN each pair. Leave the section empty to compare every rule on
; each device, matched by name across all its policies.
;AZURE USE Transit  = AZURE USW Transit
;KF-CLOUD-PREFILTER = KF-CLOUD-PREFILTER

[compare]
; Which rule fields count as drift. "default" is everything except comment,
; position and policy name (see README); "all" is every field. Or list them:
;   action, disabled, log, sources, destinations, services, applications,
;   users, urls, profiles, schedules, source_zones, destination_zones,
;   negation, category, comment, order, policy
; A rule-documentation property can be compared too, as prop:<Property Name>,
; e.g.  prop:Business Owner
fields = default

; How rule objects (networks, services, ...) are compared:
;   name     - by object name. Right when both firewalls share an object
;              store (the same FMC); an object renamed on one side is drift.
;   contents - by what the object resolves to (addresses, proto/port), whatever
;              it is called. Right across separate managers, and it catches an
;              object with the same name but different members.
;   both     - name and contents must both match.
object_mode = name

; How rules are paired up across the two firewalls:
;   name      - by rule name (after [normalise]). Works for any two policies,
;               including two different policies that mirror each other. A
;               rule renamed on one side reads as missing + extra.
;   vendor_id - by the vendor's own rule id (the FMC rule UUID on Firepower).
;               Use it when both firewalls carry the SAME policy from the same
;               manager -- an HA pair, or two devices assigned one access
;               control policy. A renamed rule is then reported as a rename.
;               A rule without a vendor id falls back to its name.
match_by = name

; The report compares the configurations FireMon last RETRIEVED from each
; firewall. If those retrievals are further apart than this many hours, the
; report carries a warning that its findings may be retrieval lag rather
; than drift, and the subject says so. 0 turns the check off.
max_revision_skew_hours = 24

; Match rule names case-insensitively.
match_case_insensitive = false

; Where a rule's category comes from. The property is authoritative (it is
; what FireMon parsed); the comment pattern lets the category be read without
; fetching rule documentation. Both defaults match Cisco Firepower.
category_property        = FMC ACP Category
category_comment_pattern = cat:\s*([^;]*?)\s*;

; Rule documentation (custom properties) costs one small API call per rule.
;   auto   - fetch every rule's documentation only when a filter or a compared
;            field needs a property. The category is read from the rule
;            comment where it can be (FMC writes "cat:NAME;" there) and the
;            rule-doc is fetched only for the rules whose comment carries no
;            category, so the category column and comparison are right at a
;            fraction of the cost.
;   always / never as they say. "never" leaves a rule with an empty comment
;            showing no category.
fetch_ruledoc = auto

[normalise]
; Regex substitutions applied to rule, object and zone names on BOTH sides
; before matching, so a site token does not make every rule read as drift.
; Format:  label = pattern => replacement   (Python regex; \b is a word edge)
; The raw names are still what the report shows. Uncomment to use:
;site_east = (?i)\bUSE\b => SITE
;site_west = (?i)\bUSW\b => SITE

[filter]
; Restrict the comparison to a subset of rules. Empty = every rule. A rule is
; in scope when it matches ALL the criteria set here; within one criterion
; any listed value will do. Values are case-insensitive globs (* and ?).
; Run --list-properties to see the categories and property values in use.

; FMC access-control category (or whatever category_property names).
categories =

; Change request / ticket numbers, matched as substrings of the rule's CR
; property and of its comment.
change_requests =

; Application, matched against the rule's Application Name property and any
; application objects on the rule.
applications =

; Rule name globs, e.g.  ALLOW_*, *SAP*
rule_names =

; Disabled rules are compared by default (a rule disabled on one side only is
; drift). Set false to leave them out entirely.
include_disabled = true

; Property names the change-request and application filters read.
cr_property          = Change Control Number (CR)
application_property = Application Name

[property_filters]
; Any other rule-documentation property:  Property Name = value, value2
;Business Owner = netops@example.com
;Certification Status = Certified

[email]
; Who receives the report, comma-separated. A [pair:NAME] section can name
; its own recipients instead.
recipients =

; When to send:
;   drift   - only when at least one difference exists (default)
;   always  - every run, including "no drift" (a heartbeat)
;   changes - only when a finding is new, or a previous one has resolved,
;             since the last live run
;   never   - never email; write the report to output_dir only
send_when = drift

; Optional string prepended to every subject, e.g. [TEST] while piloting.
subject_prefix =

attach_csv  = true
attach_json = false

; Longest rule table and most differing rules rendered into the email. Every
; finding is always in the CSV regardless. Gmail clips HTML bodies over
; ~102 KB; these defaults stay well inside that.
max_rows       = 50
max_diff_rules = 30

; Link used for the "Open FireMon Security Manager" button. Defaults to
; <base_url>/securitymanager/ when blank.
portal_url =

; Address quoted in the email as the contact for questions. Falls back to
; reply_to, then to from_address.
support_email =

[smtp]
; FireMon does not expose its own mail relay through the API, so the report
; needs its own. On the appliance, localhost:25 works if a local MTA is
; configured; otherwise point this at your organisation's relay.
host         = localhost
port         = 25
use_starttls = false
username     =
password     =
from_address = firemon-noreply@example.com
from_name    = FireMon Policy Drift Monitor
reply_to     =
timeout      = 30

[paths]
; Relative paths resolve against the directory holding THIS config file.
; Under cron prefer absolute paths.
template_dir = ./templates
output_dir   = ./out
; The last run's findings, so the next run can say what is new.
state_dir    = ./state
; Keep the log beside the install, or leave blank for console only.
log_file     = ./drift.log
